[project]
name = "construction-ops-automation"
version = "0.1.0"
description = "AI extraction and matching service for Airtable construction operations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "anthropic>=0.40.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyairtable>=3.0.0",
    "rapidfuzz>=3.10.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "reportlab>=4.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real Anthropic/Airtable APIs (deselected by default)",
]
addopts = "-m 'not live'"
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
